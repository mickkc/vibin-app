name: vibin_app
description: "Cross-platform app for the self-hosted music streaming server Vibin'"

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^2.0.0

  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0

  retrofit: ^4.9.1
  logger: ^2.6.2
  json_annotation: ^4.9.0
  dio: ^5.9.0
  get_it: ^9.2.0
  go_router: ^18.1.3
  provider: ^6.1.5+1
  package_info_plus: ^10.2.2
  intl: any

  web: ^1.1.2

  just_audio: ^0.10.5
  audio_service: ^0.18.18
  just_audio_media_kit: ^2.1.0

  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  media_kit_libs_android_audio: any
  media_kit_libs_ios_audio: any
  media_kit_libs_macos_audio: any
  just_audio_web: any

  share_plus: ^13.3.1
  url_launcher: ^6.3.2

  dbus: ^0.8.0

  file_picker: ^13.3.2
  flutter_colorpicker: ^1.1.0

  super_sliver_list: ^0.4.1

  timezone: ^0.11.2

  web_socket_channel: ^3.0.3

  carousel_slider: ^5.1.1
  flutter_fullscreen: ^1.2.0

  skeletonizer: ^3.0.0

  uuid: ^4.5.2

  flutter_svg: ^2.3.0

  talker: ^5.2.0
  talker_dio_logger: ^5.1.17
  talker_flutter: ^5.2.0

  dart_discord_presence: ^1.2.2
  device_info_plus: ^13.3.0

dependency_overrides:
  analyzer: ^14.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex-VariableFont.ttf
  assets:
    - assets/icons/icon.png
    - assets/icons/app_icon.ico
    - assets/images/checkerboard.png
    - assets/images/Cat_Searching_Pose.svg
    - assets/images/Error_State_Pose.svg
    - assets/icons/services/last_fm.svg
    - assets/icons/services/listenbrainz.svg
    - assets/images/icon-tr.svg